# Single entry point: Next.js on /, FastAPI on /api/ (prefix stripped).
# Plain HTTP on port 80. TLS is terminated in front of this container (on Dokploy that is
# Traefik, usually behind Cloudflare); see docs/DOKPLOY.md.

# Docker's embedded DNS. Re-resolving the service names means a recreated container (new IP)
# is picked up without restarting nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream frontend {
    zone frontend 64k;
    server frontend:3000 resolve;
    keepalive 16;
}

upstream backend {
    zone backend 64k;
    server backend:8000 resolve;
    keepalive 16;
}

# Keep the scheme the TLS terminator saw; fall back to our own when the request came straight in.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;

    # Resume PDF uploads
    client_max_body_size 10m;
    client_body_timeout 30s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml image/svg+xml font/ttf font/otf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The trailing slash on proxy_pass strips /api: /api/auth/login -> backend /auth/login
    location /api/ {
        proxy_pass http://backend/;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    # Next.js build assets are content-hashed, so they can be cached for a long time.
    location /_next/static/ {
        proxy_pass http://frontend;
        include /etc/nginx/conf.d/proxy_params.inc;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://frontend;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
}
